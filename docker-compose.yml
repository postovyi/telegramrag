services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT}:${APP_PORT}"
    env_file:
      - .env
    environment:
      LLM_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/app/app
      - hf_cache:/root/.cache/huggingface
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${APP_PORT} --reload"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telegramrag

  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "${DB_PORT}:5432"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - telegramrag

networks:
  telegramrag:
    driver: bridge

volumes:
  postgres_data:
  hf_cache:
