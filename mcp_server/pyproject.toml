[project]
name = "rag-mcp-server"
version = "0.1.0"
description = "Local MCP server exposing telegramrag's RAG retrieval as an MCP tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.28.0",
]

[project.scripts]
rag-mcp-server = "rag_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_mcp"]
